{% extends "base.html" %}

{% block title %}
Register · PocketSmart AI
{% endblock %}


{% block content %}

<section class="auth card">

    <h1>
        Create your account
    </h1>


    <form id="registerForm">

        <label>
            Full name

            <input
                name="full_name"
                required
                minlength="2"
            >
        </label>


        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
                minlength="8"
            >
        </label>


        <button class="btn">
            Register
        </button>


        <p
            id="message"
            class="message"
        ></p>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Login
        </a>.

    </p>

</section>

{% endblock %}


{% block scripts %}

<script>

bindAuthForm(
    "registerForm",
    "/api/auth/register",
    "/dashboard"
);

</script>

{% endblock %}
