{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<section class="auth card">

    <h1>
        Welcome back
    </h1>

    <form id="loginForm">

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >
        </label>


        <button class="btn">
            Login
        </button>


        <p
            id="message"
            class="message"
        ></p>

    </form>


    <p>
        New here?

        <a href="/register">
            Create an account
        </a>.
    </p>

</section>

{% endblock %}


{% block scripts %}

<script>

bindAuthForm(
    "loginForm",
    "/api/auth/login",
    "/dashboard"
);

</script>

{% endblock %}
